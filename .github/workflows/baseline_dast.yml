name: DAST - OWASP ZAP
on: [pull_request]
permissions:
  contents: read
  issues: write
jobs:
  zap_baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://public-firing-range.appspot.com'   # cel do skanu
