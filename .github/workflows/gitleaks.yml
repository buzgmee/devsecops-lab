name: Secrets - Gitleaks
on: [push, pull_request]        # skanuj przy każdym pushu i PR
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # WAŻNE: pobierz całą historię (nie tylko ostatni commit)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
